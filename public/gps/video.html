<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vidéo du match</title><link rel="stylesheet" href="video.css"></head>
<body><header><strong>Vidéo du match</strong><span id="connection">Connexion…</span></header>
<video id="video" controls playsinline preload="metadata"></video>
<footer><div class="controls"><button id="play">▶ Lecture</button><span id="clock">00:00:00.000</span><select id="rate" aria-label="Vitesse vidéo"><option value="0.5">× 0,5</option><option value="1" selected>× 1</option><option value="2">× 2</option><option value="5">× 5</option><option value="10">× 10</option><option value="20">× 20</option></select><button id="zero">Revenir à 0</button></div><label for="timeline">Timeline vidéo</label><input id="timeline" type="range" min="0" max="0" step="0.001" value="0"><p id="message">Choisissez une vidéo dans la fenêtre GPS.</p></footer><script src="video-player.js"></script></body></html>
